# Ambiente local completo: SQL Server + scripts do banco + API.
# Uso: copie .env.exemplo para .env, defina SA_SENHA e rode "docker compose up --build".
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_SENHA:?defina SA_SENHA no arquivo .env}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  # Cria o banco e executa os scripts 01 a 07 (e os testes de fumaça) uma única vez.
  banco-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_SENHA: ${SA_SENHA}
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/inicializar.sh"]

  api:
    build: .
    depends_on:
      banco-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Persistencia__Provedor: SqlServer
      ConnectionStrings__Unifica: "Server=sqlserver;Database=Unifica;User Id=sa;Password=${SA_SENHA};TrustServerCertificate=True"
    ports:
      - "8080:8080"
