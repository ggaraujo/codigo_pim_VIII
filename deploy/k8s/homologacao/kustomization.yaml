apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: unifica-homologacao
resources:
  - ../base
images:
  - name: unifica-api
    newName: acrunificahml.azurecr.io/unifica-api
    newTag: latest   # o pipeline troca pela tag do commit (kustomize edit set image)
patches:
  # Homologação: uma réplica fixa e host próprio.
  - target: {kind: HorizontalPodAutoscaler, name: unifica-api}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target: {kind: Ingress, name: unifica-api}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api-hml.unifica.alunostech.example
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api-hml.unifica.alunostech.example
  # Com uma réplica, o PDB não pode exigir 1 disponível (bloquearia a manutenção dos nós).
  - target: {kind: PodDisruptionBudget, name: unifica-api}
    patch: |-
      - op: remove
        path: /spec/minAvailable
      - op: add
        path: /spec/maxUnavailable
        value: 1
