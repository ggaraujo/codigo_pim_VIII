# Escalabilidade horizontal: de 2 a 10 réplicas conforme o uso de CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unifica-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unifica-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
