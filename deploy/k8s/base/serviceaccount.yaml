# Identidade de carga de trabalho (Workload Identity): o pod recebe um token do
# Entra ID para acessar o Azure SQL e o Key Vault, sem senha armazenada.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unifica-api
  annotations:
    azure.workload.identity/client-id: "<client-id-da-identidade-gerenciada>"
